<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Button Fix Example</title>
  <style>
    /* Basic layout for demo */
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin: 40px; background:#f7f7f8; color:#111; }
    .sidebar { width: 240px; background:#fff; border:1px solid #e6e6e6; padding:16px; border-radius:8px; }
    .menu-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; cursor:pointer; }
    .menu-item:hover { background:#f0f0f0; }
    .create-button { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; border:0; background:#111; color:#fff; cursor:pointer; }
    .create-button svg { width:18px; height:18px; fill:currentColor; }
    /* Modal */
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:none; align-items:center; justify-content:center; z-index:9998; }
    .modal { background:#fff; padding:20px; border-radius:8px; width:320px; box-shadow:0 8px 24px rgba(0,0,0,0.15); }
    .modal h2 { margin:0 0 12px 0; font-size:18px; }
    .modal button { margin-top:12px; }
    /* Safety CSS in case overlays exist */
    .create-button, .create-link { position:relative; z-index:9999; pointer-events:auto; }
    .possible-overlay { pointer-events:none; }
  </style>
</head>
<body>

  <div class="sidebar" role="navigation" aria-label="Main sidebar">
    <div class="menu-item">
      <!-- Correct Create control as a button -->
      <button type="button" class="create-button" aria-label="Create" id="createBtn">
        <!-- Reuse the same SVG icon you had -->
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span>Create</span>
      </button>
    </div>

    <div class="menu-item">Dashboard</div>
    <div class="menu-item">Profile</div>
    <div class="menu-item">More</div>
  </div>

  <!-- Modal markup -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" role="document">
      <h2>Create new post</h2>
      <p>Demo create flow. Replace with your real create UI.</p>
      <button id="closeModal">Close</button>
    </div>
  </div>

  <script>
    // Minimal JS to open the create modal
    (function(){
      const createBtn = document.getElementById('createBtn');
      const backdrop = document.getElementById('modalBackdrop');
      const closeBtn = document.getElementById('closeModal');

      function openCreateModal() {
        backdrop.style.display = 'flex';
        backdrop.setAttribute('aria-hidden','false');
        // focus management for accessibility
        closeBtn.focus();
      }

      function closeCreateModal() {
        backdrop.style.display = 'none';
        backdrop.setAttribute('aria-hidden','true');
        createBtn.focus();
      }

      createBtn.addEventListener('click', function(e){
        e.preventDefault();
        openCreateModal();
      });

      closeBtn.addEventListener('click', function(){
        closeCreateModal();
      });

      // close on backdrop click
      backdrop.addEventListener('click', function(e){
        if (e.target === backdrop) closeCreateModal();
      });

      // keyboard escape
      document.addEventListener('keydown', function(e){
        if (e.key === 'Escape' && backdrop.style.display === 'flex') closeCreateModal();
      });
    })();
  </script>
</body>
</html>
