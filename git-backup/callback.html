<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TikTok OAuth Callback</title>
  </head>
  <body>
    <h2>TikTok OAuth Callback</h2>
    <p>You may now close this window.</p>

    <script>
      // Capture the full redirect URL (with code)
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");

      // Send the code back to your local app (optional)
      if (code) {
        fetch("http://127.0.0.1:5000/oauth/callback?code=" + code)
          .catch(() => {});
      }
    </script>
  </body>
</html>
